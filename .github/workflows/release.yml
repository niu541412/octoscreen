name: Release Octoscreen

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      SCHEME: Octoscreen
      CONFIGURATION: Release
      PRODUCT: Octoscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build screen saver
        run: |
          xcodebuild \
            -project Octoscreen.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk macosx \
            -derivedDataPath "build-${{ matrix.arch }}" \
            ARCHS="${{ matrix.arch }}" \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Validate and package
        run: |
          SAVER="build-${{ matrix.arch }}/Build/Products/${CONFIGURATION}/${PRODUCT}.saver"
          ARCH="${{ matrix.arch }}"
          test -d "$SAVER"
          test "$(lipo -archs "$SAVER/Contents/MacOS/${PRODUCT}")" = "$ARCH"
          codesign --verify --deep --strict --verbose=2 "$SAVER"
          ditto -c -k --sequesterRsrc --keepParent "$SAVER" "${PRODUCT}-${ARCH}.saver.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Octoscreen-${{ matrix.arch }}
          path: Octoscreen-${{ matrix.arch }}.saver.zip

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-15
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.saver.zip
